# Crawl seeds. Each corpus lists index files (llms.txt style) to discover pages from,
# an allow-list of URL prefixes (nothing outside it is fetched, including redirect targets),
# and pages to fetch directly whether or not an index links to them.

[[corpus]]
name = "openserv"
enabled = true
indexes = ["https://docs.openserv.ai/llms.txt"]
allow = ["https://docs.openserv.ai/"]
pages = [
    "https://docs.openserv.ai/changelog/overview.md",
    "https://docs.openserv.ai/serv-reasoning/introduction.md",
    "https://docs.openserv.ai/serv-reasoning/models.md",
]
max_pages = 500

[[corpus]]
name = "reppo"
enabled = true
indexes = ["https://docs.reppo.ai/llms.txt"]
allow = [
    "https://docs.reppo.ai/",
    "https://eval.reppo.xyz/agents.md",
]
pages = [
    "https://docs.reppo.ai/concepts/evaluation-api.md",
    "https://docs.reppo.ai/api/eval/overview.md",
    "https://eval.reppo.xyz/agents.md",
]
max_pages = 500

# Optional third corpus, off by default so the sponsor snapshots stay comparable. Its index was
# probed on 2026-11-15 (200, 73 .md pages) and crawled once with `--corpus kite` into
# data/snapshots-kite/ (git-ignored; see docs/LIMITATIONS.md, "A third documentation site").
[[corpus]]
name = "kite"
enabled = false
indexes = ["https://docs.gokite.ai/llms.txt"]
allow = ["https://docs.gokite.ai/"]
pages = []
max_pages = 500
