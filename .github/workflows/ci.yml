name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push cancels the older run of the same ref instead of running both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  # Fail if uv.lock and pyproject.toml disagree, in every uv command (sync, run, build).
  UV_LOCKED: "1"

# Each check is its own job so a lint failure cannot hide a test failure behind it.
# No job needs a secret or the network: a fresh clone passes with zero API keys.
# Actions are pinned to full commit SHAs (the tag is in the comment); Dependabot bumps them.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    # Windows too: development happens there, and path or line-ending bugs only show up there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # Branch coverage measured 94% on 2026-11-15; the floor leaves room for platform branches.
      - run: uv run pytest --cov=currant --cov-branch --cov-report=term --cov-fail-under=92
      # A broken argparse wiring in a subcommand the tests do not reach would otherwise ship.
      - run: uv run currant --help
      # The committed demo needs no key and no network: a stranger can do exactly this.
      - run: uv run currant replay examples/demo/receipt.json --db examples/demo/store.db
      - run: uv run currant replay examples/real/receipt.json --db examples/real/store.db
      - run: uv run currant verify-signature examples/real/receipt.json --public-key "$(cat examples/real/signing-public-key.txt)"
      # The public drift pages must be exactly what their data builds, every quote verbatim.
      - run: uv run python scripts/build_drift_page.py --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv build
      - name: The wheel carries the receipt viewer
        run: |
          python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); need={'currant/web/index.html','currant/web/viewer.js','currant/web/viewer.css'}; missing=need-set(names); assert not missing, missing"

  mutants:
    # Break each named guard (Python checks and SQLite triggers) and require a test to fail.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/mutation_check.py

  audit:
    # Known vulnerabilities in every locked dependency (runtime and dev). This job reads the
    # public PyPI advisory database; it needs no secret.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv export --format requirements-txt --no-hashes --no-emit-project -o requirements-audit.txt
      - run: uvx pip-audit==2.9.0 -r requirements-audit.txt

  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      # Env reads only in config.py, no secret-shaped strings, .env ignored, HTTP clients only
      # in the cli/ package / live_* scripts, no skipped tests or suppressed type/lint failures.
      - run: uv run python -m currant.guardrails

  replay-pin:
    # The hosted replay installs Currant at the commit pinned in site/requirements.txt; fail when
    # src/currant has moved past it, so the deployed code is the code tested here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/check_replay_pin.py

  site:
    # The landing site deploys to Vercel; a broken page or type error must fail here first.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No version: it reads `packageManager` from site/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  snapshots:
    # Re-hash every committed snapshot against its manifest. On Windows as well, which proves
    # .gitattributes keeps the crawled bytes intact through a CRLF-converting checkout.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - shell: bash
        run: |
          shopt -s nullglob
          dirs=(snapshots/*/)
          # An empty glob would pass vacuously; three snapshots are committed.
          if [ "${#dirs[@]}" -lt 3 ]; then echo "expected >= 3 snapshots, found ${#dirs[@]}"; exit 1; fi
          for dir in "${dirs[@]}"; do
            uv run currant verify "$dir"
          done
